# Registers the slash commands and sets the interactions endpoint, for one copy (order 10; scripts/discord/register.ts):
#   dev:        guild-scoped to the test server, the Dev app (DISCORD_*), the dev Worker.
#   production: global, the MNM-Guildcraft app (PROD_DISCORD_*), the production Worker, plus the app's icon.
# Reads both back. Runs only after a successful deploy.yml run on main, and only if the live Worker answers an invalid
# signature with 401. A tail records the requests Discord sends to validate the endpoint (PING and invalid
# signatures), never a member's command. read_only reads the registered definitions back and writes nothing.
# Expected: ~1 billed minute per run.
name: register-commands
on:
  workflow_dispatch:
    inputs:
      copy:
        description: 'Which copy'
        type: choice
        options: [dev, production]
        default: dev
      read_only:
        description: 'Only read the registered commands back (no PUT, no endpoint change)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency: register-commands-${{ inputs.copy }}
jobs:
  register:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GUILDCRAFT_COPY: ${{ inputs.copy }}
    steps:
      - name: Require the latest deploy.yml run on main to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --limit 1 --json databaseId,status,conclusion,headSha)"
          echo "latest deploy run: $run"
          test "$(echo "$run" | jq -r '.[0].conclusion')" = "success"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start a tail on the copy's Worker
        run: |
          worker="$(node --input-type=module -e "import { currentCopy } from './scripts/copies.ts'; console.log(currentCopy().worker)")"
          nohup npx wrangler tail "$worker" --format json > tail.jsonl 2> tail.err &
          sleep 20
      - name: Register commands and set the endpoint
        env:
          # The copy's own secrets only: a missing production secret stops the run, never falls back to the Dev app's.
          DISCORD_BOT_TOKEN: ${{ secrets[format('{0}DISCORD_BOT_TOKEN', inputs.copy == 'production' && 'PROD_' || '')] }}
          DISCORD_APPLICATION_ID: ${{ secrets[format('{0}DISCORD_APPLICATION_ID', inputs.copy == 'production' && 'PROD_' || '')] }}
          DISCORD_TEST_GUILD_ID: ${{ inputs.copy == 'dev' && secrets.DISCORD_TEST_GUILD_ID || '' }}
          READ_ONLY: ${{ inputs.read_only && '1' || '' }}
        run: |
          test -n "$DISCORD_BOT_TOKEN" || { echo "::error::the ${{ inputs.copy }} bot token secret is not set"; exit 1; }
          test -n "$DISCORD_APPLICATION_ID" || { echo "::error::the ${{ inputs.copy }} application id secret is not set"; exit 1; }
          node scripts/discord/register.ts
      - name: Discord validation requests seen by the Worker (status and CPU time only)
        if: always()
        run: |
          sleep 15
          pkill -f "wrangler tail" || true
          echo "tail events: $(grep -c . tail.jsonl || true)"
          jq -c 'select(type == "object") | {outcome, status: .event.response.status, cpuTime, wallTime}' tail.jsonl || true
          grep -iE "error|denied|permission" tail.err | head -5 || true
