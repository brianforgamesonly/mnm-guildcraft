# Registers the slash commands (guild-scoped to the test server), sets the interactions endpoint
# to the dev Worker, and reads both back. Discord validates the endpoint on save with a signed PING;
# a tail captures that request's CPU time. Expected: ~1 billed minute per run.
name: register-commands
on: workflow_dispatch
permissions:
  contents: read
concurrency: register-commands
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start a tail on the dev Worker
        run: |
          nohup npx wrangler tail mnm-guildcraft-dev --format json > tail.jsonl 2> tail.err &
          sleep 20
      - name: Register commands and set the endpoint
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_TEST_GUILD_ID: ${{ secrets.DISCORD_TEST_GUILD_ID }}
        run: node scripts/discord/register.ts
      - name: Requests seen by the Worker (status and CPU time only)
        if: always()
        run: |
          sleep 15
          pkill -f "wrangler tail" || true
          echo "tail events: $(grep -c . tail.jsonl || true)"
          jq -c 'select(type == "object") | {outcome, status: .event.response.status, cpuTime, wallTime}' tail.jsonl || true
          grep -iE "error|denied|permission" tail.err | head -5 || true
