# Nightly free-tier usage (order 8, ITEM 2; PRD FR-8): the previous UTC day(s), account-wide, into usage_daily
# (scripts/usage/run.ts). The dev copy's /guildcraft status shows it, and the dev Worker's */15 cron posts the usage
# warning from it in the test server (src/usage.ts; order 11: production posts none). The Worker holds no Cloudflare
# credential; this job uses the existing API token (Account Analytics Read, Workers Observability Write).
# Schedule: 05:43 UTC, off the hour (GitHub delays and may drop runs at the start of every hour); the previous UTC day
# is complete by then. Expected: <1 billed minute a run (public repository: free), ~15 a month.
#
# Two alarms, each with its own state, so one never silences the other. Both notify by GitHub's failed-run mail to
# "the user who last modified the cron syntax" (the repository owner), at most once a day:
#   the job's own (ORDER-RULES order 8): failing when usage_daily's newest figures are over 30 hours old, or the
#          measurement failed; a failure while already failing does not fail the run again (scripts/ci/alarm.ts);
#   the usage level (order 11, override 1; production's run only, the figures being account-wide): fails once when a
#          metric crosses up to 10% of its Free limit, yesterday against the day before in usage_daily; staying over
#          passes; dropping back under is reported in the summary and passes (scripts/usage/level-alarm.ts).
#          Order 26 (override 1): a failing level alarm also carries its cause, as an ::error annotation and in the
#          summary, per day judged: the day, the database (dev / production / other), the top 3 statements (literals as
#          ?) and that UTC day's workflow runs (scripts/usage/cause.ts). Reading the cause never changes the outcome.
#
# Dispatch: dry_run (default true) prints the rows it would write and writes nothing.
name: usage
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print the usage_daily rows, write nothing'
        type: boolean
        default: true
      days:
        description: 'Days to measure, ending yesterday (default: 7 on the first run, then 2)'
        default: ''
      copy:
        description: 'Which copy to write to (the figures are account-wide either way)'
        type: choice
        options: [both, dev, production]
        default: both
permissions:
  contents: read
  # Order 26 (override 2): used only to list the judged UTC day's workflow runs for the level alarm's cause.
  actions: read
# Order 10: one job per copy (scripts/copies.ts). The figures are account-wide, so both databases get the same rows and
# both apps' /guildcraft status shows the whole account. Each job alarms for its own copy: a GraphQL outage mails twice.
jobs:
  # The copies are wrangler.jsonc's environments (scripts/copies.ts matrix), never a list typed here.
  copies:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      list: ${{ steps.c.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: c
        shell: bash
        env:
          WANT: ${{ inputs.copy || 'both' }}
        run: node --input-type=module -e "import { matrix } from './scripts/copies.ts'; console.log('list=' + JSON.stringify(matrix(process.env.WANT)))" | tee -a "$GITHUB_OUTPUT"
  usage:
    needs: copies
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.copies.outputs.list) }}
    concurrency: usage-${{ matrix.copy }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GUILDCRAFT_COPY: ${{ matrix.copy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Usage (dry run = ${{ inputs.dry_run == true }})
        env:
          DAYS: ${{ inputs.days }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/usage/run.ts ${{ inputs.dry_run == true && '--dry-run' || '' }} ${{ inputs.days && '--days "$DAYS"' || '' }}
