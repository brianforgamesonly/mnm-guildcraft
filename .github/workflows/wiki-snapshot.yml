# Order 28, ITEM 1: the wiki snapshot by dispatch, to refresh the committed data/wiki-snapshot by hand (order 28's
# override 8). The job itself is .github/workflows/wiki-job.yml, shared with import.yml's nightly wiki job (order 28b,
# PR D): it waits for deploys, deploys and deletes the relay, and uploads the snapshot as the artifact `wiki-snapshot`.
# Dispatch only, never scheduled. No alarm: a failed run is read by the person who dispatched it (order 12: every failed
# run is listed in the order's report). Order 28b, PR D: the comparison with Mo Betta ended with order 28's gate.
# Expected: about 2 billed minutes per run (public repository: free); Cloudflare as in wiki-job.yml.
name: wiki-snapshot
on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'List the categories (titles only), print the content plan, and stop before reading any page content'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  wiki:
    uses: ./.github/workflows/wiki-job.yml
    secrets: inherit
    with:
      plan_only: ${{ inputs.plan_only }}
