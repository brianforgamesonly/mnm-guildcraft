# Reads the dev Worker's interaction timings back from Workers Logs (work order 3, ITEM 3.1 b) and prints
# p50/p95 per path. Dispatch only; reads, writes nothing. Expected: <1 billed minute per run.
# Needs the API token permission "Workers Observability Write" (the telemetry query API's only listed
# permission); if missing, the run says so and fails.
name: timings
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look back this many hours (Workers Logs keeps 3 days on the free plan)'
        default: '72'
      from:
        description: 'Window start, ISO UTC (overrides hours), e.g. 2026-10-19T20:50:00Z'
        default: ''
      to:
        description: 'Window end, ISO UTC (default now)'
        default: ''
      requests:
        description: 'Also print one line per request (ids redacted)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Timings per path
        env:
          HOURS: ${{ inputs.hours }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REQUESTS: ${{ inputs.requests && '1' || '' }}
        run: node scripts/bench/timings.mjs "$HOURS"
