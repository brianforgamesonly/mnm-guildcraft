# Reads the dev Worker's interaction timings back from Workers Logs (work order 3, ITEM 3.1 b) and prints
# p50/p95 per path. Dispatch only; reads, writes nothing. Expected: <1 billed minute per run.
# Needs the API token permission "Workers Observability Write" (the telemetry query API's only listed
# permission); if missing, the run says so and fails.
# Order 7 (ITEM 1.1): every run ends with the logs completeness check (scripts/bench/logs-check.mjs) and fails
# when an event type does not reconcile with its own record. The daily schedule runs it over the last 24 hours,
# so a mismatch arrives as a failed run (GitHub mails the repository owner). Expected: <1 billed minute a day.
# Order 8 (ITEM 3.1), the alarm (ORDER-RULES order 8):
#   who:   GitHub's failed-run mail to "the user who last modified the cron syntax" (Brian);
#   how often: at most once a day (one scheduled run a day);
#   state: (a) gaps Cloudflare's analytics does not explain, the reader coming up short, or audit rows unread: each
#          scheduled window is new, so each fails; (b) the 7-day drop-rate bound over its threshold
#          (scripts/bench/logs-check.mjs): fails only on crossing it. A platform drop (an invocation analytics counts
#          as a success, missing from the logs) never fails: it is counted in the job summary and the drop history.
# The drop history (dates and counts only; this repository is public) passes from one scheduled run to the next as
# the artifact drop-history (14 days' retention).
name: timings
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look back this many hours (Workers Logs keeps 3 days on the free plan)'
        default: '72'
      from:
        description: 'Window start, ISO UTC (overrides hours), e.g. 2026-10-19T20:50:00Z'
        default: ''
      to:
        description: 'Window end, ISO UTC (default now)'
        default: ''
      requests:
        description: 'Also print one line per request (ids redacted)'
        type: boolean
        default: false
      facts:
        description: 'Also print read-only D1 facts (scripts/bench/d1-facts.mjs; fixed SELECTs)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  timings:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The previous scheduled run's drop history
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow timings.yml --event schedule --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n drop-history -D "$RUNNER_TEMP/prev" || echo "run $id has no drop history: starting a new one"; else echo "no earlier scheduled run"; fi
      - name: Timings per path
        env:
          HOURS: ${{ inputs.hours || '24' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REQUESTS: ${{ inputs.requests && '1' || '' }}
          DROP_HISTORY_IN: ${{ runner.temp }}/prev/drop-history.json
          DROP_HISTORY_OUT: ${{ github.event_name == 'schedule' && format('{0}/drop-history.json', runner.temp) || '' }}
        run: node scripts/bench/timings.mjs "$HOURS"
      - name: Keep the drop history for the next scheduled run
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: drop-history
          path: ${{ runner.temp }}/drop-history.json
          retention-days: 14
          if-no-files-found: ignore
      - if: inputs.facts
        run: npm ci
      - name: Read-only D1 facts
        if: inputs.facts
        run: node scripts/bench/d1-facts.mjs
