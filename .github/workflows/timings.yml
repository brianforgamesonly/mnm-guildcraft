# Reads the dev Worker's interaction timings back from Workers Logs (work order 3, ITEM 3.1 b) and prints
# p50/p95 per path. Dispatch only; reads, writes nothing. Expected: <1 billed minute per run.
# Needs the API token permission "Workers Observability Write" (the telemetry query API's only listed
# permission); if missing, the run says so and fails.
# Order 7 (ITEM 1.1): every run ends with the logs completeness check (scripts/bench/logs-check.mjs). The daily
# schedule runs it over the last 24 hours. Expected: <1 billed minute a day.
# Order 20 (override 1, replacing orders 7, 8, 15 and 19's alarm here): REPORT ONLY. It never fails on Cloudflare log or
# analytics completeness: both sources are estimates (analytics is sampled, the logs' event counts overstate), so a gap
# between them cannot tell real loss from noise. The completeness figures, the drop-rate bound and the speed per path
# stay in the job summary, for information. It fails only when it cannot run (an API error). The alarm on missed work
# is the health job's, on the bot's own records (.github/workflows/health.yml).
# The drop history (dates and counts only; this repository is public) passes from one scheduled run to the next as
# the artifact drop-history (14 days' retention).
name: timings
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look back this many hours (Workers Logs keeps 3 days on the free plan)'
        default: '72'
      from:
        description: 'Window start, ISO UTC (overrides hours), e.g. 2026-10-19T20:50:00Z'
        default: ''
      to:
        description: 'Window end, ISO UTC (default now)'
        default: ''
      requests:
        description: 'Also print one line per request (ids redacted)'
        type: boolean
        default: false
      facts:
        description: 'Also print read-only D1 facts (scripts/bench/d1-facts.mjs; fixed SELECTs; dev only)'
        type: boolean
        default: false
      copy:
        description: 'Which copy to read'
        type: choice
        options: [both, dev, production]
        default: both
permissions:
  contents: read
  actions: read
# Order 10: one job per copy, each reading its own Worker's logs against its own database's audit rows.
jobs:
  # The copies are wrangler.jsonc's environments (scripts/copies.ts matrix), never a list typed here.
  copies:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      list: ${{ steps.c.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: c
        shell: bash
        env:
          WANT: ${{ inputs.copy || 'both' }}
        run: node --input-type=module -e "import { matrix } from './scripts/copies.ts'; console.log('list=' + JSON.stringify(matrix(process.env.WANT)))" | tee -a "$GITHUB_OUTPUT"
  timings:
    needs: copies
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.copies.outputs.list) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GUILDCRAFT_COPY: ${{ matrix.copy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The previous scheduled run's drop history
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow timings.yml --event schedule --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n "drop-history-${{ matrix.copy }}" -D "$RUNNER_TEMP/prev" || echo "run $id has no drop history: starting a new one"; else echo "no earlier scheduled run"; fi
      - name: Timings per path
        env:
          HOURS: ${{ inputs.hours || '24' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REQUESTS: ${{ inputs.requests && '1' || '' }}
          DROP_HISTORY_IN: ${{ runner.temp }}/prev/drop-history.json
          DROP_HISTORY_OUT: ${{ github.event_name == 'schedule' && format('{0}/drop-history.json', runner.temp) || '' }}
        run: node scripts/bench/timings.mjs "$HOURS"
      - name: Keep the drop history for the next scheduled run
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: drop-history-${{ matrix.copy }}
          path: ${{ runner.temp }}/drop-history.json
          retention-days: 14
          if-no-files-found: ignore
      - if: inputs.facts && matrix.copy == 'dev'
        run: npm ci
      - name: Read-only D1 facts
        if: inputs.facts && matrix.copy == 'dev'
        run: node scripts/bench/d1-facts.mjs
