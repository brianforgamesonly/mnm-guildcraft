# Order 30 (ITEM 4): the DKP decay guard on one copy, by dispatch (scripts/discord/decay-guard.ts): asks the live Worker to
# ensure each DKP-on server's weekly decay item. The cron does this daily and register-commands after a registration;
# this is for a dry run and for proving it. Prints counts only.
# Dispatch only. Expected: <1 billed minute per run.
name: decay-guard
on:
  workflow_dispatch:
    inputs:
      copy:
        description: 'Which copy'
        type: choice
        options: [dev, production]
        default: dev
      dry_run:
        description: 'Report what it finds; nothing is written'
        type: boolean
        default: true
permissions:
  contents: read
concurrency: decay-guard-${{ inputs.copy }}
jobs:
  guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GUILDCRAFT_COPY: ${{ inputs.copy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Decay guard (dry run = ${{ inputs.dry_run }})
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # The copy's own secret only, as register-commands.yml.
          DISCORD_BOT_TOKEN: ${{ secrets[format('{0}DISCORD_BOT_TOKEN', inputs.copy == 'production' && 'PROD_' || '')] }}
        run: node scripts/discord/decay-guard.ts
