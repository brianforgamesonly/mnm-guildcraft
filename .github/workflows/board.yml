# The roster board's dry run and rollback (work order 5, ITEM 1.1; scripts/board/run.mjs).
#   render: read-only; renders every board post and the index from the remote dev D1 (names pseudonymised).
#   delete: the rollback; deletes the bot-owned board posts and clears the board channel. dry_run (default)
#           prints what it would delete and changes nothing.
# Dispatch only. Expected: <1 billed minute per run.
name: board
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'render (read-only) or delete (rollback)'
        type: choice
        options: [render, delete]
        default: render
      dry_run:
        description: 'delete only: print what would be deleted, change nothing'
        type: boolean
        default: true
permissions:
  contents: read
concurrency: board-dev
jobs:
  board:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Board ${{ inputs.action }} (dry run = ${{ inputs.action == 'render' || inputs.dry_run }})
        env:
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ (inputs.action == 'render' || inputs.dry_run) && '1' || '0' }}
          DISCORD_BOT_TOKEN: ${{ inputs.action == 'delete' && !inputs.dry_run && secrets.DISCORD_BOT_TOKEN || '' }}
        run: node scripts/board/run.mjs
