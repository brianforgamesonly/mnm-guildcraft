# The roster board's dry runs, live checks and rollback (work orders 5 and 6; scripts/board/run.mjs).
#   render:  read-only; renders every board post and the index from the remote dev D1 (names pseudonymised).
#   inspect: read-only; the live posts (creation time, message_count, archived), the board order, and what a
#            rebuild would create and guard.
#   archive: live check; archives the post of `skill` and marks it for the next refresh (dry_run must be off).
#   refresh: one board invocation with the Worker's own code and 40-call budget; `rebuild` asks for and
#            continues the A→Z rebuild (dry_run must be off).
#   delete:  the rollback; deletes the bot-owned board posts and clears the board channel. dry_run (default)
#            prints what it would delete and changes nothing.
#   departures: order 7; the nightly departure run (src/departures.ts) invoked directly. dry_run (default) lists the
#            server's members and prints who would be marked (pseudonyms) and the notices owed, changing nothing.
# Dispatch only. Expected: <1 billed minute per run.
name: board
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'render / inspect (read-only), archive / refresh (live), delete (rollback)'
        type: choice
        options: [render, inspect, archive, refresh, delete, departures]
        default: render
      dry_run:
        description: 'delete: print what would be deleted, change nothing. archive and refresh need this off.'
        type: boolean
        default: true
      skill:
        description: 'archive only: the tradeskill whose post is archived'
        default: ''
      rebuild:
        description: 'refresh only: ask for (or continue) the A→Z rebuild'
        type: boolean
        default: false
permissions:
  contents: read
concurrency: board-dev
jobs:
  board:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Board ${{ inputs.action }} (dry run = ${{ inputs.action == 'render' || inputs.action == 'inspect' || inputs.dry_run }})
        env:
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ (inputs.action == 'render' || inputs.action == 'inspect' || inputs.dry_run) && '1' || '0' }}
          SKILL: ${{ inputs.skill }}
          REBUILD: ${{ inputs.rebuild && '1' || '0' }}
          DISCORD_BOT_TOKEN: ${{ (inputs.action == 'inspect' || inputs.action == 'departures' || ((inputs.action == 'archive' || inputs.action == 'refresh' || inputs.action == 'delete') && !inputs.dry_run)) && secrets.DISCORD_BOT_TOKEN || '' }}
        run: node scripts/board/run.mjs
