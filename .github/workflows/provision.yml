# Creates the dev D1 database if missing and prints its ID (not secret) for wrangler.jsonc.
# Also the check of the Cloudflare token's permissions. Expected: <1 billed minute per run.
# The pull_request trigger (only when this file changes, same-repo branches only) exists because
# workflow_dispatch needs the file on main first, and the ID must be committed before the merge.
name: provision
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/provision.yml']
permissions:
  contents: read
concurrency: provision
jobs:
  d1:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure the D1 database mnm-guildcraft-dev exists
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "mnm-guildcraft-dev") | (.uuid // .id)'; }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "creating mnm-guildcraft-dev"
            npx wrangler d1 create mnm-guildcraft-dev
            id="$(find_id)"
          else
            echo "already exists"
          fi
          test -n "$id"
          echo "database_id=$id"
      - name: workers.dev subdomain (needed for the Worker URL)
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -c '{workers_dev_subdomain_exists: ((.result.subdomain // "") != ""), subdomain: .result.subdomain, success, errors: [.errors[]? | {code, message}]}'
