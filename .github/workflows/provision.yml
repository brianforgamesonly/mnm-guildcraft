# Creates each copy's D1 database if missing (order 10: every wrangler.jsonc environment, scripts/copies.ts) and
# prints its ID (not secret) for wrangler.jsonc. Also reports whether each copy's Worker name is already taken in the
# account, and the workers.dev subdomain. Expected: <1 billed minute per run.
# The pull_request trigger (only when this file changes, same-repo branches only) exists because
# workflow_dispatch needs the file on main first, and the ID must be committed before the merge.
name: provision
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/provision.yml']
permissions:
  contents: read
concurrency: provision
jobs:
  d1:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure every copy's D1 database exists
        run: |
          node --input-type=module -e "import { copies } from './scripts/copies.ts'; for (const c of copies()) console.log(c.name, c.database, c.worker)" > copies.txt
          cat copies.txt
          find_id() { npx wrangler d1 list --json | jq -r --arg n "$1" '.[] | select(.name == $n) | (.uuid // .id)'; }
          while read -r copy db worker; do
            id="$(find_id "$db")"
            if [ -z "$id" ]; then
              echo "$copy: creating $db"
              npx wrangler d1 create "$db"
              id="$(find_id "$db")"
            else
              echo "$copy: $db already exists"
            fi
            test -n "$id"
            echo "$copy database_id=$id"
          done < copies.txt
      - name: Worker names already in the account (a name in use by something else must not be overwritten)
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            | jq -c '{success, scripts: [.result[]?.id], errors: [.errors[]? | {code, message}]}'
      - name: workers.dev subdomain (needed for the Worker URL)
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -c '{workers_dev_subdomain_exists: ((.result.subdomain // "") != ""), subdomain: .result.subdomain, success, errors: [.errors[]? | {code, message}]}'
