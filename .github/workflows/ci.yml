# Typecheck and tests on every pull request. Expected: ~1-2 billed minutes per run (public repo: free).
# The action-runtime check (order 4) adds a few seconds: one raw.githubusercontent.com fetch per distinct action.
name: ci
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:hook
      - run: npm run test:actions
      - run: npm run test:logs
      - run: npm run test:backup
      - run: npm run test:export
      - run: npm run test:routes
      - run: npm run test:operator-text
      - run: npm run test:health
      - run: npm run test:emoji
      # Order 17b: a zone's site link held on main may not disappear (src/zone/sites.json); the base copy is fetched.
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - run: npm run test:zone-sites
      - name: Every action runs on the allowed Node runtime
        run: node scripts/ci/action-runtimes.mjs
  # Order 26: the zone benches (orders 17b and 23) read a local D1 that this job fills with the real import, never a
  # Cloudflare database. Read from the dev copy, they read about 450,000 rows per run (order 26, ITEM 1: 2026-10-25 and
  # 10-27's spikes), against D1 Free's 5,000,000 a day for the whole account. No Cloudflare secret. Order 13's "measured on
  # a local database first" import, so the source is fetched pinned from GitHub as the nightly import fetches it.
  # Expected: about 3 billed minutes per pull request (public repo: free).
  local-data:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:local
      # A fresh import fits one run under the write ceiling today (35,948 of 40,000 rows, order 26); the second run
      # finishes a partial one, and writes next to nothing otherwise.
      - name: The real import, into the local D1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/import/run.ts --local > "$RUNNER_TEMP/import-1.json"
          node scripts/import/run.ts --local > "$RUNNER_TEMP/import-2.json"
          tail -n 3 "$RUNNER_TEMP/import-1.json" "$RUNNER_TEMP/import-2.json"
      # Order 17b: every zone card, rendered by this pull request's code: the atlas ids, the link buttons and rows_read
      # per card, before the merge. Public game data only.
      - name: Zone cards (local D1)
        run: node scripts/bench/zone-cards.ts ${{ vars.ATLAS_ZONE_IMAGES == 'on' && '--atlas-images' || '' }} --show 'evershade weald'
      # Order 23: zone names matched per source, and zone buttons per /gear page and /item card. Public game data only.
      - name: Zone buttons (local D1)
        run: node scripts/bench/zone-buttons.ts
      # Order 26: no workflow that runs on a pull request reads a Cloudflare database through a --remote script.
      - run: npm run test:ci-reads
  # Order 8 (ITEM 0): the credentials' reach, read-only, before the merge (a same-repository pull_request run
  # receives secrets; dispatch works only from the default branch). Prints statuses, field names and counts only.
  # Expected: under 1 billed minute per pull request (public repo: free); order 26 moved the zone benches to local-data.
  reach:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Order 20: the health check's dry run reads GitHub's workflow runs (deploy windows, failed nightly runs).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: GraphQL analytics, introspected, and one small D1 query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/usage/run.ts --introspect-only
      - name: The backup token's reach (unset is reported, not failed)
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: node scripts/backup/reach.ts
      # Order 20: this pull request's health check on both copies' real records for yesterday, report-only (SELECTs and
      # GitHub run reads only; counts and times, no guild data). A few seconds. It fails only if the check cannot run.
      - name: Health check dry run, dev (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GUILDCRAFT_COPY: dev
        run: node scripts/health/run.ts --report-only
      - name: Health check dry run, production (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GUILDCRAFT_COPY: production
        run: node scripts/health/run.ts --report-only
